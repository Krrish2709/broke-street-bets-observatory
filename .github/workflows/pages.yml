name: Deploy research dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Check Pages size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('public').rglob('*') if p.is_file())
          print(f'Published payload: {size:,} bytes')
          assert size < 1_000_000_000, 'Site exceeds the GitHub Pages size limit'
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
